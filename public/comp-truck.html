<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comp · Truck configurator</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--asphalt:#141414;--bone:#EFE8D8;--orange:#FF5A1F;--sea:#15A3A3;--line:#2A2A2A;--muted:#8E877A}
  *{box-sizing:border-box;margin:0}
  body{background:var(--asphalt);color:var(--bone);font-family:"Bricolage Grotesque",sans-serif;padding:48px clamp(20px,4vw,56px)}
  .mono{font-family:"Space Mono",monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
  h2{font-size:clamp(2.4rem,5vw,4.6rem);font-weight:800;line-height:.9;letter-spacing:-.03em;text-transform:uppercase}
  h2 span{color:var(--orange)}
  .cfg{display:grid;grid-template-columns:7fr 4fr;gap:40px;align-items:center;margin-top:40px;border-top:1px solid var(--line);padding-top:40px}
  .stage{position:relative;aspect-ratio:1202/600;perspective:1200px}
  .stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;transform-style:preserve-3d}
  .seg{display:inline-flex;border:1px solid var(--bone)}
  .seg button{background:transparent;color:var(--bone);border:0;padding:12px 18px;font:700 12px "Space Mono",monospace;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
  .seg button[aria-pressed=true]{background:var(--orange);color:var(--asphalt)}
  .specs{margin-top:28px;border-top:1px dashed #444}
  .specs div{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0;border-bottom:1px dashed #444}
  .specs b{font-size:clamp(1.6rem,3vw,2.6rem);font-weight:800;letter-spacing:-.03em;line-height:1}
  .specs b em{color:var(--orange);font-style:normal}
  .hint{color:var(--muted);margin-top:18px}
  @media (max-width:900px){.cfg{grid-template-columns:1fr}}
</style>
</head>
<body>
<p class="mono" style="color:var(--orange);margin-bottom:14px">Transport &amp; logistics · the truck</p>
<h2>One truck.<br>Two <span>jobs.</span></h2>

<div class="cfg">
  <div class="stage" id="stage">
    <svg viewBox="0 -90 1202 600" xmlns="http://www.w3.org/2000/svg" id="truck">
      <defs>
        <clipPath id="bedClip"><rect x="552" y="-90" width="615" height="290"/></clipPath>
      </defs>
      <!-- shadow -->
      <ellipse cx="600" cy="492" rx="560" ry="14" fill="#000" opacity=".45"/>

      <!-- bed interior backdrop (behind rack contents) -->
      <rect id="bedBack" x="560" y="120" width="600" height="80" fill="#1c1c1c" opacity="0"/>

      <!-- CARGO: boxes, hidden by default -->
      <g id="cargo" clip-path="url(#bedClip)">
        <g class="box"><rect x="590" y="92" width="150" height="108" fill="#E6DCC6"/><rect x="590" y="92" width="150" height="14" fill="#C9BC9E"/><text x="612" y="160" font-family="Space Mono" font-size="16" fill="#141414">FRAGILE</text></g>
        <g class="box"><rect x="755" y="122" width="200" height="78" fill="#DED3B9"/><rect x="755" y="122" width="200" height="12" fill="#C9BC9E"/></g>
        <g class="box"><rect x="970" y="60" width="170" height="140" fill="#E6DCC6"/><rect x="970" y="60" width="170" height="14" fill="#C9BC9E"/><text x="995" y="140" font-family="Space Mono" font-size="16" fill="#141414">1.2 m³</text></g>
        <g class="box"><rect x="760" y="56" width="120" height="60" fill="#D4C9AE"/></g>
      </g>

      <!-- truck body photo -->
      <image href="/images/truck-body.png" x="0" y="0" width="1202" height="510"/>

      <!-- RACK: steel frame, always visible -->
      <g id="rack" fill="none" stroke="#B9B2A3" stroke-width="7" stroke-linecap="round">
        <path d="M562 197 V22 H1158 V197"/>
        <path d="M562 22 L600 -4 H1120 L1158 22" />
        <path d="M562 110 H1158"/>
        <path d="M562 22 L562 197 M1158 22 L1158 197"/>
        <path d="M640 197 V22 M720 197 V22 M800 197 V22 M880 197 V22 M960 197 V22 M1040 197 V22" stroke-width="5" opacity=".7"/>
      </g>

      <!-- SURF: seats + surfers, visible above the rail under the canopy -->
      <g id="crew">
        <g class="surfer"><rect x="615" y="150" width="54" height="50" rx="6" fill="#2a2a2a"/><circle cx="642" cy="128" r="18" fill="#C98A5A"/><rect x="620" y="146" width="44" height="20" rx="8" fill="#FF5A1F"/></g>
        <g class="surfer"><rect x="745" y="150" width="54" height="50" rx="6" fill="#2a2a2a"/><circle cx="772" cy="128" r="18" fill="#8A5A3C"/><rect x="750" y="146" width="44" height="20" rx="8" fill="#15A3A3"/></g>
        <g class="surfer"><rect x="875" y="150" width="54" height="50" rx="6" fill="#2a2a2a"/><circle cx="902" cy="128" r="18" fill="#E0B58C"/><rect x="880" y="146" width="44" height="20" rx="8" fill="#EFE8D8"/></g>
        <g class="surfer"><rect x="1005" y="150" width="54" height="50" rx="6" fill="#2a2a2a"/><circle cx="1032" cy="128" r="18" fill="#B07850"/><rect x="1010" y="146" width="44" height="20" rx="8" fill="#FF5A1F"/></g>
      </g>

      <!-- SURF: canopy (tarp) over the rack -->
      <g id="canopy">
        <path d="M556 24 L600 -8 H1120 L1164 24 V40 H556 Z" fill="#FF5A1F"/>
        <path d="M556 40 H1164 V110 L1150 110 V40" fill="#FF5A1F" opacity=".92"/>
        <path d="M556 40 V110 H1164 V40" fill="#E8491A"/>
        <text x="760" y="88" font-family="Bricolage Grotesque" font-weight="800" font-size="40" fill="#141414" letter-spacing="-1">RADICAL MARINO</text>
      </g>

      <!-- SURF: boards on the roof rail -->
      <g id="boards">
        <path d="M600 -30 Q860 -62 1120 -30 Q860 -2 600 -30 Z" fill="#EFE8D8" stroke="#141414" stroke-width="2"/>
        <path d="M600 -30 Q860 -50 1120 -30" fill="none" stroke="#FF5A1F" stroke-width="5"/>
        <path d="M620 -50 Q860 -82 1100 -50 Q860 -22 620 -50 Z" fill="#15A3A3" stroke="#141414" stroke-width="2"/>
        <path d="M640 -70 Q860 -100 1080 -70 Q860 -42 640 -70 Z" fill="#EFE8D8" stroke="#141414" stroke-width="2"/>
      </g>

      <!-- CARGO: dimension line -->
      <g id="dims" font-family="Space Mono" font-size="16" fill="#FF5A1F" stroke="#FF5A1F">
        <path d="M562 230 H1158" stroke-width="2" stroke-dasharray="8 6"/>
        <path d="M562 220 V240 M1158 220 V240" stroke-width="2"/>
        <text x="820" y="262" stroke="none" text-anchor="middle">BED 2.0 × 1.5 M · APPROX.</text>
      </g>
    </svg>
  </div>

  <div>
    <div class="seg" role="group" aria-label="Mode">
      <button id="btnSurf" aria-pressed="true">Surf mode</button>
      <button id="btnCargo" aria-pressed="false">Cargo mode</button>
    </div>
    <div class="specs" id="specs"></div>
    <p class="hint">Canopy on, seats in: four surfers ride covered, boards go on the rack. Canopy off: an open bed for gear, moves and freight.</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  const specs = {
    surf: [["Surfers in the back", "4"], ["Boards on the rack", "6"], ["Crew in the cab", "2"]],
    cargo: [["Payload", "~800 <em>kg</em>"], ["Bed", "2.0 × 1.5 <em>m</em>"], ["Volume", "~2.4 <em>m³</em>"]],
  };
  const el = (id) => document.getElementById(id);
  const render = (mode) => { el('specs').innerHTML = specs[mode].map(([k, v]) => `<div><span class="mono">${k}</span><b>${v}</b></div>`).join(''); };

  const ease = 'expo.out';
  gsap.set('#canopy', { transformOrigin: '50% 0%' });
  gsap.set('.box', { transformOrigin: '50% 100%' });
  gsap.set('.surfer', { transformOrigin: '50% 100%' });

  const toSurf = gsap.timeline({ paused: true, defaults: { ease, duration: .6 } })
    .to('.box', { y: 110, opacity: 0, stagger: .04, duration: .4, ease: 'power2.in' }, 0)
    .to('#dims', { opacity: 0, duration: .3 }, 0)
    .fromTo('.surfer', { y: 80, opacity: 0 }, { y: 0, opacity: 1, stagger: .07 }, .25)
    .fromTo('#canopy', { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: .7 }, .35)
    .fromTo('#boards', { y: -90, opacity: 0, rotation: -2, transformOrigin: '50% 50%' }, { y: 0, opacity: 1, rotation: 0, duration: .8 }, .7);

  const toCargo = gsap.timeline({ paused: true, defaults: { ease, duration: .6 } })
    .to('#boards', { y: -90, opacity: 0, duration: .45, ease: 'power2.in' }, 0)
    .to('#canopy', { scaleY: 0, opacity: 0, duration: .5, ease: 'power2.in' }, .15)
    .to('.surfer', { y: 80, opacity: 0, stagger: .05, duration: .4, ease: 'power2.in' }, .25)
    .fromTo('.box', { y: 110, opacity: 0 }, { y: 0, opacity: 1, stagger: .06 }, .55)
    .fromTo('#dims', { opacity: 0 }, { opacity: 1, duration: .4 }, .9);

  let mode = 'cargo';
  gsap.set(['#canopy', '#boards', '.surfer'], { opacity: 0 });
  const set = (m) => {
    if (m === mode) return; mode = m;
    el('btnSurf').setAttribute('aria-pressed', m === 'surf'); el('btnCargo').setAttribute('aria-pressed', m === 'cargo');
    (m === 'surf' ? toSurf : toCargo).restart();
    render(m);
  };
  el('btnSurf').onclick = () => set('surf'); el('btnCargo').onclick = () => set('cargo');
  render('cargo'); setTimeout(() => set('surf'), 600);

  // mouse tilt
  const stage = el('stage'), svg = el('truck');
  stage.addEventListener('mousemove', (e) => {
    const r = stage.getBoundingClientRect(); const px = (e.clientX - r.left) / r.width - .5, py = (e.clientY - r.top) / r.height - .5;
    gsap.to(svg, { rotateY: px * 10, rotateX: -py * 6, x: px * 14, duration: .6, ease: 'power3.out' });
  });
  stage.addEventListener('mouseleave', () => gsap.to(svg, { rotateY: 0, rotateX: 0, x: 0, duration: .8, ease: 'power3.out' }));
</script>
</body>
</html>
